name: Deploy Quartz site to GitHub Pages  # 这就是 workflow 名，以后 Actions tab 就叫这个
on:
  push:
    branches: [ v4 ]  # 如果你的分支是 main，改成 [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04  # 稳定 runner，避免 queued
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取 git 历史，用于链接
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # 2025 年 Quartz v4 要求
      - name: Install Dependencies
        run: npm ci  # 安装 Quartz 依赖
      - name: Build Quartz
        run: npx quartz build  # 生成 public/ 文件夹
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
